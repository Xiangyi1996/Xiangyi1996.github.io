name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-citations
  cancel-in-progress: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the latest citation count
        run: node scripts/update-scholar-citations.mjs

      - name: Publish the change
        run: |
          if git diff --quiet -- index.html; then
            echo "Citation count has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Google Scholar citation count"
          git push
